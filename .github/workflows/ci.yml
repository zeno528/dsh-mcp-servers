name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: JSON validity
        run: node -e "for (const f of ['package.json','locale/en.json','locale/zh.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"

      # Fails if any file in package.json "files" is missing, i.e. the bundle
      # is installable as declared.
      - name: Bundle integrity
        run: npm pack --dry-run
